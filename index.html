<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="description" content="A private, offline-first running training planner and workout log.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Training">
    <title>My Training</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="stylesheet" href="./app.css">
  </head>
  <body>
    <div class="app-shell">
      <div class="storage-warning" id="storage-warning" role="status" hidden>
        Device storage is unavailable. Changes will last only until this page closes.
      </div>

      <header class="app-header">
        <div class="header-copy">
          <p class="eyebrow" id="header-eyebrow">Loading plan</p>
          <h1 id="header-title">My Training</h1>
        </div>
        <button class="icon-button" type="button" data-action="open-data" aria-label="Open data and backup settings">•••</button>
      </header>

      <main id="app-main" class="app-main" tabindex="-1">
        <section class="loading-state" aria-live="polite">
          <div class="loading-mark" aria-hidden="true"></div>
          <p>Loading your plan…</p>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <button class="nav-button" type="button" data-route="today">
          <span class="nav-symbol" aria-hidden="true">●</span><span>Today</span>
        </button>
        <button class="nav-button" type="button" data-route="plan">
          <span class="nav-symbol" aria-hidden="true">≡</span><span>Plan</span>
        </button>
        <button class="nav-button" type="button" data-route="progress">
          <span class="nav-symbol" aria-hidden="true">▥</span><span>Progress</span>
        </button>
      </nav>
    </div>

    <dialog class="sheet-dialog" id="session-dialog" aria-labelledby="session-dialog-title">
      <div id="session-dialog-content"></div>
    </dialog>

    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <noscript>
      <p class="noscript">My Training needs JavaScript to save workouts on this device.</p>
    </noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
